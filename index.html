<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem("mneme.theme") === "dark" ? "dark" : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
      try {
        const appearance = JSON.parse(localStorage.getItem("mneme.appearance") || "{}");
        for (const key of ["accent", "sidebar", "pageWidth", "pageFont", "textSize", "compact"])
          if (key in appearance) document.documentElement.dataset[key] = String(appearance[key]);
      } catch {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mneme</title>
    <style>
      #launch-screen {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding-bottom: 6vh;
        background: #ffffff;
        color: #70747c;
        font: 13px "Avenir Next", Avenir, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        cursor: default;
        user-select: none;
      }
      [data-theme="dark"] #launch-screen {
        background: #171b24;
        color: #a4abaf;
      }
      #launch-screen::before,
      #launch-screen::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        opacity: 0;
      }
      #launch-screen::before {
        background-image: radial-gradient(circle, rgb(23 27 36 / 0.14) 1px, transparent 1.5px);
        background-size: 24px 24px;
        background-position: center;
        mask-image: radial-gradient(ellipse 60% 55% at 50% 46%, #000 20%, transparent 100%);
        animation: launch-fade 600ms ease-out forwards;
      }
      #launch-screen::after {
        background: radial-gradient(circle 300px at 50% 46%, rgb(197 247 79 / 0.16), transparent);
        animation: launch-fade 900ms ease-out 650ms forwards;
      }
      [data-theme="dark"] #launch-screen::before {
        background-image: radial-gradient(circle, rgb(238 242 228 / 0.09) 1px, transparent 1.5px);
      }
      [data-theme="dark"] #launch-screen::after {
        background: radial-gradient(circle 300px at 50% 46%, rgb(197 247 79 / 0.07), transparent);
      }
      #launch-screen:not([data-shown])::before,
      #launch-screen:not([data-shown])::after { animation-play-state: paused; }
      #launch-screen svg {
        width: 64px;
        height: 64px;
        overflow: visible;
      }
      #launch-screen .wordmark {
        margin: 0;
        color: #171b24;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.01em;
        opacity: 0;
        animation: launch-fade 400ms ease-out 2250ms forwards;
      }
      [data-theme="dark"] #launch-screen .wordmark { color: #eef2e4; }
      #launch-screen output {
        position: absolute;
        bottom: 12vh;
        opacity: 0;
        animation: launch-fade 240ms ease-out 4s forwards;
      }
      #launch-screen .thread {
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: launch-draw 900ms cubic-bezier(0.65, 0, 0.35, 1) 650ms forwards;
      }
      #launch-screen .roll-in {
        opacity: 0;
        animation: launch-roll 650ms cubic-bezier(0.33, 1, 0.68, 1) forwards;
      }
      #launch-screen .drop-in {
        opacity: 0;
        animation: launch-drop 700ms linear 1550ms forwards;
      }
      #launch-screen:not([data-shown]) * { animation-play-state: paused; }
      @keyframes launch-draw { to { stroke-dashoffset: 0; } }
      @keyframes launch-roll {
        from { opacity: 0; transform: translateX(-320px); }
        25% { opacity: 1; }
        to { opacity: 1; transform: translateX(0); }
      }
      @keyframes launch-drop {
        0% { opacity: 0; transform: translateY(-200px); animation-timing-function: cubic-bezier(0.55, 0, 1, 0.45); }
        15% { opacity: 1; }
        45% { transform: translateY(0); animation-timing-function: cubic-bezier(0, 0.55, 0.45, 1); }
        65% { transform: translateY(-36px); animation-timing-function: cubic-bezier(0.55, 0, 1, 0.45); }
        82% { transform: translateY(0); animation-timing-function: cubic-bezier(0, 0.55, 0.45, 1); }
        91% { transform: translateY(-10px); animation-timing-function: cubic-bezier(0.55, 0, 1, 0.45); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes launch-fade { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #launch-screen .thread,
        #launch-screen .roll-in,
        #launch-screen .drop-in,
        #launch-screen .wordmark,
        #launch-screen output,
        #launch-screen::before,
        #launch-screen::after {
          animation: none;
          stroke-dashoffset: 0;
          opacity: 1;
        }
      }
    </style>
  </head>

  <body>
    <div id="launch-screen" data-chain-drag-region>
      <svg viewBox="0 0 256 256" fill="none" aria-hidden="true">
        <rect x="8" y="8" width="240" height="240" rx="52" fill="#171B24" />
        <path
          class="thread"
          pathLength="1"
          d="M52 182V91C52 74.984 64.984 62 81 62s29 12.984 29 29v54c0 16.016 12.984 29 29 29s29-12.984 29-29V91c0-16.016 12.984-29 29-29s29 12.984 29 29v91"
          transform="translate(-8 5)"
          stroke="#EEF2E4"
          stroke-width="20"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <circle class="roll-in" cx="44" cy="187" r="12" fill="#C5F74F" />
        <circle class="drop-in" cx="196" cy="187" r="12" fill="#C5F74F" />
      </svg>
      <p class="wordmark">mneme</p>
      <output>Opening your workspace…</output>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
